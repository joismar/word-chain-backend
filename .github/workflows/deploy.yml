name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'lambda/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  LAMBDA_RUNTIME: python3.13

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tests
        working-directory: lambda
        env:
          POWERTOOLS_TRACE_DISABLED: '1'
          POWERTOOLS_LOG_LEVEL: CRITICAL
        run: |
          pip install -r requirements-dev.txt
          python -m protocol.export_schema --check
          python -m unittest discover -s tests -p '*_test.py'

  deploy:
    name: Build & Deploy Lambda
    needs: test
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package Lambda Function
        run: |
          mkdir -p build
          
          # Se houver requirements.txt, instala as dependências na pasta de build
          if [ -f lambda/requirements.txt ]; then
            pip install --target build -r lambda/requirements.txt
          fi
          
          # Copia os arquivos da Lambda para a pasta de build
          # Ignorando diretório de testes e arquivos temporários/configurações locais
          rsync -av --exclude='tests' \
                    --exclude='local' \
                    --exclude='.venv' \
                    --exclude='requirements*.txt' \
                    --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='.pylintrc' \
                    --exclude='.python-version' \
                    lambda/ build/
          
          # Gera o arquivo zip para deploy
          cd build
          zip -r ../lambda_deployment.zip .
          cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'sa-east-1' }}

      - name: Deploy Code to AWS Lambda
        env:
          FUNCTION_NAME: ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "$FUNCTION_NAME" ]; then
            echo "Error: AWS_LAMBDA_FUNCTION_NAME secret is not set."
            exit 1
          fi
          
          echo "Updating Lambda function: $FUNCTION_NAME..."
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda_deployment.zip
          
          echo "Waiting for function update to complete..."
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

          echo "Setting runtime to $LAMBDA_RUNTIME..."
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime "$LAMBDA_RUNTIME"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "Deploy completed successfully!"
