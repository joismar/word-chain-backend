name: Deploy

# dev branch -> stack word-chain-dev, main branch -> stack word-chain-prod.
# AWS access comes from GitHub OIDC (infra/github-oidc.yaml); no stored keys.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'lambda/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tests
        working-directory: lambda
        env:
          POWERTOOLS_TRACE_DISABLED: '1'
          POWERTOOLS_LOG_LEVEL: CRITICAL
        run: |
          pip install -r requirements-dev.txt
          python -m protocol.export_schema --check
          python -m unittest discover -s tests -p '*_test.py'

  deploy:
    name: SAM deploy
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Validate template
        run: sam validate --lint

      - name: Build
        run: sam build

      - name: Deploy
        run: |
          sam deploy \
            --config-env "$STAGE" \
            --role-arn "${{ vars.AWS_CFN_EXEC_ROLE_ARN }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show WebSocket URL
        run: |
          aws cloudformation describe-stacks --stack-name "word-chain-$STAGE" \
            --query "Stacks[0].Outputs[?OutputKey=='WebSocketUrl'].OutputValue" \
            --output text
