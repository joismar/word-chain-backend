AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap for GitHub Actions deploys of word-chain-backend (OIDC, no
  stored keys). Deploy by hand once per account:
  aws cloudformation deploy --template-file infra/github-oidc.yaml
  --stack-name word-chain-github-oidc --capabilities CAPABILITY_NAMED_IAM

Parameters:
  GitHubRepo:
    Type: String
    Default: joismar/word-chain-backend
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: >-
      ARN of an existing token.actions.githubusercontent.com provider (an
      account can only have one). Leave empty to create it here.
  StackPrefix:
    Type: String
    Default: word-chain
    Description: Stacks, functions, tables and roles the deploy may touch start with this.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Assumed by the workflow. It can only drive CloudFormation on our stacks and
  # hand CloudFormation the execution role below; it cannot touch resources.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs that run in the repo's dev/prod environments.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:environment:dev
                  - !Sub repo:${GitHubRepo}:environment:prod
      Policies:
        - PolicyName: sam-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-dev/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-prod/*
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: TemplateChecks
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              # sam deploy --resolve-s3 uses the bucket of this stack, created by
              # the first deploy from a developer machine.
              - Sid: SamManagedStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: HandOverToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # What CloudFormation uses to create the stack's resources (sam deploy --role-arn).
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-cfn-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: word-chain-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Tables
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackPrefix}-*
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackPrefix}-*
              - Sid: WebSocketApis
                Effect: Allow
                Action: apigateway:*
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              - Sid: LogGroups
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackPrefix}-*
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*
              - Sid: FunctionCode
                Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*

Outputs:
  DeployRoleArn:
    Description: GitHub environment variable AWS_DEPLOY_ROLE_ARN (dev and prod).
    Value: !GetAtt DeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: GitHub environment variable AWS_CFN_EXEC_ROLE_ARN (dev and prod).
    Value: !GetAtt CloudFormationExecutionRole.Arn
